name: kova-store

services:
  app:
    build: .
    image: kova-store:local
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - kova-data:/app/data
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped

  gateway:
    image: kova-store:local
    pull_policy: never
    command: ["node", "server/gateway.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:${KOVA_PORT:-4327}:8080"
    networks:
      - ingress
      - application
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  kova-data:

networks:
  ingress:
  application:
    internal: true
